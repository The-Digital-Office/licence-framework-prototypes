description:
  en:
    shortDescription: >-
      Prototype tools to help councils make consistent, defensible Microsoft
      365 licensing decisions.
    longDescription: >-
      Clickable prototypes of the Licence Audit and Allocation Framework,
      developed by the LocalGov M365 Foundations Programme for Scottish local
      authorities.


      The organisational baseline tool guides a short session through a
      structured set of questions about the security, compliance and
      productivity capabilities a council needs, and produces a baseline
      statement used as the reference for every licence allocation and audit
      in the year ahead.


      The allocation flow tests whether a person meets the six F3 gate
      conditions, captures any additional requirements as named capabilities,
      and works through the device licensing checks, producing a decision
      record that tells HR and IT what to provision.


      Each tool is a single self-contained HTML page that runs in the browser
      with no server, build step or external dependencies. These are
      prototypes for comment and are not final guidance.
    features:
      - "Organisational baseline statement for Microsoft 365 capabilities"
      - "F3 gate conditions check for individual licence allocation"
      - "Device licensing checks"
      - "Decision record for HR and IT"

